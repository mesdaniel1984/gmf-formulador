<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMF Formulador</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#1e3a8a,#0ea5e9);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:16px;padding:36px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.25)}
.logo{text-align:center;margin-bottom:28px}
.logo-icon{width:64px;height:64px;background:#1e3a8a;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:26px}
h1{font-size:19px;font-weight:800;color:#1e3a8a;text-align:center}
p{font-size:12px;color:#666;text-align:center;margin-top:3px}
.tabs{display:flex;background:#f3f4f6;border-radius:8px;padding:3px;margin:20px 0}
.tab{flex:1;padding:8px;border:none;border-radius:6px;background:transparent;font-size:13px;font-weight:600;color:#666;cursor:pointer}
.tab.on{background:#fff;color:#1e3a8a;box-shadow:0 1px 4px rgba(0,0,0,0.1)}
.fg{margin-bottom:14px}
label{display:block;font-size:11px;font-weight:600;color:#374151;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
input{width:100%;height:46px;border:1.5px solid #d1d5db;border-radius:8px;padding:0 12px;font-size:16px;color:#111;outline:none}
input:focus{border-color:#1e3a8a}
.btn{width:100%;height:48px;background:#1e3a8a;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
.btn:hover{background:#1d4ed8}
.btn:disabled{background:#93c5fd}
.btn2{background:#fff;color:#1e3a8a;border:1.5px solid #1e3a8a;margin-top:10px}
.msg{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:13px;display:none}
.err{background:#fef2f2;color:#dc2626;border:1px solid #fca5a5;display:block}
.ok{background:#f0fdf4;color:#166534;border:1px solid #86efac;display:block}
#cad{display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🧪</div>
    <h1>GMF Formulador Nutricional</h1>
    <p>Grupo MF Paris Alimentos · SIF 5460</p>
  </div>
  <div class="tabs">
    <button class="tab on" onclick="aba('login')">Entrar</button>
    <button class="tab" onclick="aba('cad')">Criar conta</button>
  </div>
  <div id="login">
    <div class="fg"><label>E-mail</label><input id="le" type="email" placeholder="seu@email.com"></div>
    <div class="fg"><label>Senha</label><input id="ls" type="password" placeholder="••••••••"></div>
    <button class="btn" onclick="entrar()">Entrar</button>
    <div class="msg" id="ml"></div>
    <button class="btn btn2" onclick="magico()">📧 Receber link por e-mail</button>
  </div>
  <div id="cad">
    <div class="fg"><label>Nome</label><input id="cn" type="text" placeholder="Seu nome completo"></div>
    <div class="fg"><label>Cargo</label><input id="cc" type="text" placeholder="Ex: Analista de Qualidade"></div>
    <div class="fg"><label>E-mail</label><input id="ce" type="email" placeholder="seu@email.com"></div>
    <div class="fg"><label>Senha (mín. 6 caracteres)</label><input id="cs" type="password" placeholder="Crie uma senha"></div>
    <button class="btn" onclick="cadastrar()">Criar conta</button>
    <div class="msg" id="mc"></div>
  </div>
</div>
<script>
const URL_ = 'https://ailzblgrxtdakpkchstl.supabase.co';
const KEY_ = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFpbHpibGdyeHRkYWtwa2Noc3RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NzkzOTEsImV4cCI6MjA5NDI1NTM5MX0.P22Cz4osfMvKBsbXn1jmwDC0ZOmbNQjSB-TBHxu6qRw';
localStorage.setItem('gmf_supabase_config', JSON.stringify({url:URL_,key:KEY_}));
const sb = window.supabase.createClient(URL_, KEY_);
sb.auth.getSession().then(({data})=>{ if(data.session) go(); });

function go(){ location.href='gmf_formulador_wizard.html'; }
function msg(id,t,c){const e=document.getElementById(id);e.textContent=t;e.className='msg '+c;}
function aba(t){
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('on',(i===0&&t==='login')||(i===1&&t==='cad')));
  document.getElementById('login').style.display=t==='login'?'':'none';
  document.getElementById('cad').style.display=t==='cad'?'':'none';
}
document.getElementById('ls').addEventListener('keydown',e=>{if(e.key==='Enter')entrar();});

async function entrar(){
  const e=document.getElementById('le').value.trim();
  const s=document.getElementById('ls').value;
  if(!e||!s){msg('ml','Preencha e-mail e senha.','err');return;}
  const {error}=await sb.auth.signInWithPassword({email:e,password:s});
  if(error){msg('ml',error.message==='Invalid login credentials'?'E-mail ou senha incorretos.':error.message,'err');}
  else{msg('ml','✅ Entrando...','ok');setTimeout(go,800);}
}

async function magico(){
  const e=document.getElementById('le').value.trim();
  if(!e){msg('ml','Digite seu e-mail acima.','err');return;}
  const {error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href}});
  if(error)msg('ml',error.message,'err');
  else msg('ml','📧 Link enviado! Verifique seu e-mail.','ok');
}

async function cadastrar(){
  const n=document.getElementById('cn').value.trim();
  const c=document.getElementById('cc').value.trim();
  const e=document.getElementById('ce').value.trim();
  const s=document.getElementById('cs').value;
  if(!n||!e||!s){msg('mc','Preencha todos os campos.','err');return;}
  if(s.length<6){msg('mc','Senha mínimo 6 caracteres.','err');return;}
  const {error}=await sb.auth.signUp({email:e,password:s,options:{data:{nome:n,cargo:c}}});
  if(error)msg('mc',error.message,'err');
  else msg('mc','✅ Conta criada! Você já pode entrar.','ok');
}

if(location.hash.includes('access_token')){
  sb.auth.getSession().then(({data})=>{ if(data.session) go(); });
}
</script>
</body>
</html>
