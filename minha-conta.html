<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>Minha conta — Grupo MF Paris</title>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
<script defer src="minha-conta.js"></script>
<style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#18354a;font:16px system-ui,sans-serif;padding:24px}main{max-width:520px;margin:5vh auto;background:white;padding:28px;border:1px solid #dce5ed;border-radius:18px}a{color:#1268aa}h1{font-size:26px}p{line-height:1.5}label{display:block;margin-top:18px}input,button{width:100%;padding:13px;margin-top:8px;border:1px solid #adbfce;border-radius:8px;font:inherit}button{background:#1268aa;color:white;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#accountEmail{overflow-wrap:anywhere}#accountStatus{min-height:24px}small{display:block;line-height:1.5;color:#50687a}[hidden]{display:none!important}</style>
</head><body><main><a href="index.html">← Voltar à Central</a><h1>Minha conta</h1>
<p id="accountEmail"></p><p id="accountStatus" role="status" aria-live="polite">Verificando sua conta…</p>
<a id="accountLogin" href="login.html?next=conta" hidden>Entrar na Central</a>
<form id="passwordForm" hidden><h2>Alterar senha</h2>
<small>Esta senha vale para Central, Formulador, SGQ e SAC. CQ e P&D ainda têm acessos separados.</small>
<label for="newPassword">Nova senha</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" required>
<small>Use pelo menos 12 caracteres. Prefira uma frase longa e exclusiva.</small>
<label for="confirmPassword">Confirmar nova senha</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required>
<button id="savePassword" type="submit">Salvar nova senha</button></form></main></body></html>
