name: Phase 4.3 Sandbox CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'phase4/020_sandbox_product.sql'
      - 'phase4/test/bootstrap_sandbox.sql'
      - 'phase4/test/assertions_sandbox.sql'
      - 'docs/FASE4_3_SANDBOX_COMPARISON.md'
      - '.github/workflows/phase4-3-sandbox-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sandbox-workflow:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Bootstrap
        run: |
          psql -v ON_ERROR_STOP=1 -f phase4/test/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f phase4/test/bootstrap_rbac.sql
          psql -v ON_ERROR_STOP=1 -f phase4/test/bootstrap_sandbox.sql

      - name: Aplicar F4.1
        run: |
          psql -v ON_ERROR_STOP=1 -f phase4/001_product_revision_foundation.sql
          psql -v ON_ERROR_STOP=1 -f phase4/004_harden_revision_functions_and_indexes.sql

      - name: Aplicar F4.2
        run: psql -v ON_ERROR_STOP=1 -f phase4/010_rbac_revision_workflow.sql

      - name: Aplicar F4.3
        run: psql -v ON_ERROR_STOP=1 -f phase4/020_sandbox_product.sql

      - name: Testar sandbox e promoção
        run: psql -v ON_ERROR_STOP=1 -f phase4/test/assertions_sandbox.sql

      - name: Testar RLS de visibilidade
        run: |
          set -euo pipefail

          PD=$(psql -Atqc "
            select set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
            set role authenticated;
            select count(*) from public.produto_sandboxes;
          " | tail -1)
          test "$PD" = "2"

          QUALITY=$(psql -Atqc "
            select set_config('request.jwt.claim.sub','22222222-2222-2222-2222-222222222222',false);
            set role authenticated;
            select count(*) from public.produto_sandboxes;
          " | tail -1)
          test "$QUALITY" = "2"

          NOROLE=$(psql -Atqc "
            select set_config('request.jwt.claim.sub','44444444-4444-4444-4444-444444444444',false);
            set role authenticated;
            select count(*) from public.produto_sandboxes;
          " | tail -1)
          test "$NOROLE" = "0"

          echo "F4.3 RLS visibility OK"

      - name: Bloquear escrita direta
        run: |
          set -euo pipefail

          if psql -v ON_ERROR_STOP=1 -c "
            select set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
            set role authenticated;
            update public.produto_sandboxes set descricao='direto';
          " >/tmp/write.out 2>/tmp/write.err; then
            echo "ERRO: authenticated atualizou sandbox diretamente"
            exit 1
          fi
          grep -qi "permission denied" /tmp/write.err

          echo "F4.3 direct write blocked"

      - name: Anon não executa RPC
        run: |
          set -euo pipefail

          if psql -v ON_ERROR_STOP=1 -c "
            set role anon;
            select public.criar_sandbox_produto(1,'anon','anon',null);
          " >/tmp/anon.out 2>/tmp/anon.err; then
            echo "ERRO: anon executou RPC de sandbox"
            exit 1
          fi
          grep -qi "permission denied" /tmp/anon.err

          echo "F4.3 anon blocked"

      - name: Allowlist SECURITY DEFINER F4.3
        run: |
          set -euo pipefail

          COUNT=$(psql -Atqc "
            select count(*)
            from pg_proc p
            join pg_namespace n on n.oid=p.pronamespace
            where n.nspname='public'
              and p.proname in (
                'criar_sandbox_produto',
                'atualizar_sandbox_produto',
                'arquivar_sandbox_produto',
                'promover_sandbox_revisao'
              )
              and p.prosecdef
              and has_function_privilege('authenticated',p.oid,'EXECUTE')
              and not has_function_privilege('anon',p.oid,'EXECUTE')
              and coalesce(array_to_string(p.proconfig,','),'') like '%search_path=%';
          ")
          test "$COUNT" = "4"

          echo "F4.3 SECURITY DEFINER allowlist OK"
