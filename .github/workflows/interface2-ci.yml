name: Interface 2.0 CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    name: Integridade e sintaxe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sintaxe dos assets UI2
        run: |
          node --check gmf-interface-2.js
          node --check gmf-workspace.js
          node --check gmf-revisions.js
          node --check gmf-sandbox.js
          node --check sgq-workspace.js
          node --check gmf-auth.js
          node --check gmf-central.js
          node --check painel-admin.js
          node --check painel-admin-analytics.js
      - name: Referências genéricas — valores e preservação dos cadastros
        run: node testes/ingredientes-referencias.js
      - name: Fichas — nomes genéricos e preservação de subingredientes
        run: node testes/ingredientes-nomes-publicos.js
      - name: HTML operacional igual à baseline
        run: node testes/interface2-integridade.js
      - name: Painel Admin — contagens e datas
        run: node testes/painel-admin.js
      - name: Painel Admin — análise executiva
        run: node testes/painel-admin-analytics.js
      - name: Sessão compartilhada da Central
        run: node testes/central-session.js
      - name: Formulador — entrada direta
        run: node testes/formulador-entrada-direta.js
      - name: Security auth UI
        run: node testes/security-auth-ui.js
      - name: SAC — mensagens do bot visíveis na caixa de entrada
        run: node testes/sac-conversas-historico.js
      - name: SAC — triagem por área e rascunho de NC
        run: node testes/sac-triagem-nc.js
      - name: Interface de revisões controladas
        run: node testes/phase4-2-revisions-ui.js
      - name: Interface Sandbox F4.3
        run: node testes/phase4-3-sandbox-ui.js

  sgq-regression:
    name: Regressão SGQ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: CQ — origem da passagem entre sistemas
        run: node testes/cq-origem-post.js
      - name: Rodar suíte SGQ
        run: |
          for f in \
            testes/b0-sessao-expirada.js \
            testes/b3b5-numeracao-e-lote.js \
            testes/b4b6-etapa-e-vinculo.js \
            testes/b7-autoria.js \
            testes/b8-concorrencia-e-numero.js \
            testes/central-gestao.js \
            testes/ponte-ronda-nc.js \
            testes/sac-fila-central.js \
            testes/sac-sla.js
          do
            echo "=== $f ==="
            node "$f"
          done
      - name: Ingredientes — navegação e busca
        run: node testes/ingredientes-navegacao.js
      - name: Smoke visual UI2
        run: node testes/interface2-visual-smoke.js
      - name: Smoke visual Sandbox F4.3
        run: node testes/phase4-3-sandbox-visual-smoke.js
      - name: Painel Admin — navegação, sessão e mobile
        run: node testes/painel-admin-visual.js
      - name: Upload evidencias visuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface2-uat-gmf-sgq
          path: ui2-screens
          if-no-files-found: error
