<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Conversas do WhatsApp — SGQ MF Paris</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Lora:ital,wght@0,400;1,400&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ---------------------------------------------------------------------------
   Conversas do WhatsApp — atendimento humano.

   Por que esta tela existe: o número do SAC está na Cloud API e, por isso,
   não funciona mais no aplicativo do WhatsApp. Quem escreve algo que não é
   manifestação de consumidor (quer comprar, é representante, ligou errado)
   não vira registro de qualidade — e não tem mais "zap" onde cair. Cai aqui.

   Mesma paleta e mesmas fontes do resto do sistema.
--------------------------------------------------------------------------- */
:root{
  --papel:#FFFFFF; --fundo:#F3F5F4;
  --tinta:#16181A; --grafite:#5A6068; --risca:#DCDFE3; --campo:#F7F9F8;
  --selo:#1B5E4A; --selo-fundo:#EAF3EF;
  --realce:#B4541C; --realce-fundo:#FBF2E9;
  --alerta:#9C3025; --alerta-fundo:#FBEEEC;
  --balao-nosso:#EAF3EF; --balao-deles:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root{
    --papel:#15191B; --fundo:#0E1214;
    --tinta:#E9ECEE; --grafite:#9AA2AA; --risca:#2B3136; --campo:#1B2025;
    --selo:#6FC3A3; --selo-fundo:#16261F;
    --realce:#E2925C; --realce-fundo:#2A2015;
    --alerta:#E08478; --alerta-fundo:#2A1917;
    --balao-nosso:#16261F; --balao-deles:#1B2025;
  }
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{
  background:var(--fundo); color:var(--tinta);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; min-height:100vh;
}

/* ------------------------------------------------------------------ topo */
header{
  background:var(--papel); border-bottom:1px solid var(--risca);
  padding:calc(12px + env(safe-area-inset-top,0px)) 18px 12px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.marca{ font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
        color:var(--selo); }
h1{ font-size:19px; font-weight:700; letter-spacing:-.01em; margin:0; }
.topo-dir{ margin-left:auto; display:flex; align-items:center; gap:12px;
           font-size:12.5px; color:var(--grafite); }
.pisca{ width:7px; height:7px; border-radius:50%; background:var(--selo); display:inline-block; }

/* ------------------------------------------------------------- estrutura */
main{ flex:1; display:grid; grid-template-columns:320px 1fr; min-height:0; }
@media (max-width:820px){
  main{ grid-template-columns:1fr; }
  .painel{ display:none; }
  body.abriu .fila{ display:none; }
  body.abriu .painel{ display:flex; }
}

/* ---------------------------------------------------------------- a fila */
.fila{ border-right:1px solid var(--risca); background:var(--papel);
       overflow-y:auto; min-height:0; }
.fila-topo{ padding:12px 16px; border-bottom:1px solid var(--risca);
            font-size:11px; font-weight:700; letter-spacing:.1em;
            text-transform:uppercase; color:var(--grafite);
            display:flex; justify-content:space-between; align-items:center; }
.aba{ background:none; border:none; font:inherit; color:var(--grafite); cursor:pointer;
      padding:2px 6px; border-radius:5px; letter-spacing:.06em; }
.aba[aria-pressed="true"]{ background:var(--selo-fundo); color:var(--selo); }

.item{ width:100%; text-align:left; background:none; border:none; font:inherit;
       color:inherit; cursor:pointer; padding:13px 16px;
       border-bottom:1px solid var(--risca); display:block; }
.item:hover{ background:var(--campo); }
.item[aria-current="true"]{ background:var(--selo-fundo);
                            box-shadow:inset 3px 0 0 var(--selo); }
.item .quem{ font-weight:600; display:flex; align-items:baseline; gap:8px; }
.item .fone{ font-size:12px; color:var(--grafite); font-weight:400; }
.item .previa{ font-size:13px; color:var(--grafite); margin-top:3px;
               overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.item .quando{ font-size:11.5px; color:var(--grafite); margin-top:4px; }
.vazio{ padding:28px 18px; color:var(--grafite); font-family:Lora,Georgia,serif; }

/* -------------------------------------------------------------- o painel */
.painel{ display:flex; flex-direction:column; min-height:0; background:var(--fundo); }
.painel-topo{ background:var(--papel); border-bottom:1px solid var(--risca);
              padding:11px 18px; display:flex; align-items:center; gap:12px; }
.voltar{ display:none; background:none; border:1px solid var(--risca); border-radius:6px;
         font:inherit; color:var(--tinta); padding:4px 9px; cursor:pointer; }
@media (max-width:820px){ .voltar{ display:inline-block; } }
.painel-topo .nome{ font-weight:600; }
.painel-topo .fone{ font-size:12.5px; color:var(--grafite); }
.painel-acoes{ margin-left:auto; display:flex; gap:8px; }
.btn{ font:inherit; font-size:13px; border-radius:7px; padding:6px 12px; cursor:pointer;
      border:1px solid var(--risca); background:var(--papel); color:var(--tinta); }
.btn:hover{ background:var(--campo); }
.btn-forte{ background:var(--selo); border-color:var(--selo); color:#fff; font-weight:600; }
.btn-forte:hover{ filter:brightness(1.08); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

.conversa{ flex:1; overflow-y:auto; padding:18px; min-height:0;
           display:flex; flex-direction:column; gap:9px; }
.balao{ max-width:min(560px, 76%); padding:9px 13px; border-radius:11px;
        border:1px solid var(--risca); white-space:pre-wrap; word-break:break-word; }
.balao.deles{ background:var(--balao-deles); align-self:flex-start;
              border-bottom-left-radius:3px; }
.balao.nosso{ background:var(--balao-nosso); align-self:flex-end;
              border-bottom-right-radius:3px; }
.balao .hora{ display:block; font-size:11px; color:var(--grafite); margin-top:5px; }
.balao .anexo{ font-style:italic; color:var(--grafite); }
.dia{ align-self:center; font-size:11px; font-weight:600; letter-spacing:.08em;
      text-transform:uppercase; color:var(--grafite); margin:8px 0 2px; }

/* --------------------------------------------------------------- resposta */
.resposta{ background:var(--papel); border-top:1px solid var(--risca); padding:12px 18px
           calc(12px + env(safe-area-inset-bottom,0px)); }
.resposta textarea{ width:100%; min-height:62px; max-height:190px; resize:vertical;
  font:inherit; color:var(--tinta); background:var(--campo);
  border:1px solid var(--risca); border-radius:8px; padding:10px 12px; }
.resposta textarea:focus{ outline:2px solid var(--selo); outline-offset:-1px; }
.resposta-baixo{ display:flex; align-items:center; gap:12px; margin-top:9px; }
.dica{ font-size:12px; color:var(--grafite); }
.janela{ background:var(--realce-fundo); border:1px solid var(--realce);
         border-radius:8px; padding:11px 13px; font-size:13px; color:var(--tinta); }
.janela b{ color:var(--realce); }

.recado{ margin:0; padding:10px 14px; font-size:13px; border-radius:8px; }
.recado.erro{ background:var(--alerta-fundo); border:1px solid var(--alerta); }
.recado.ok{ background:var(--selo-fundo); border:1px solid var(--selo); }

/* ------------------------------------------------------------ sem sessao */
.portao{ max-width:460px; margin:64px auto; background:var(--papel);
         border:1px solid var(--risca); border-radius:10px; padding:26px 24px; }
.portao h2{ margin:0 0 10px; font-size:19px; }
.portao p{ font-family:Lora,Georgia,serif; color:var(--grafite); margin:0 0 16px; }
a{ color:var(--selo); }
</style>
</head>
<body>

<header>
  <div>
    <div class="marca">SGQ · Grupo MF Paris</div>
    <h1>Conversas do WhatsApp</h1>
  </div>
  <div class="topo-dir">
    <span id="quem"></span>
    <span><span class="pisca" id="pisca"></span> <span id="atualizado">—</span></span>
  </div>
</header>

<main id="tela" hidden>
  <section class="fila" aria-label="Fila de atendimento">
    <div class="fila-topo">
      <span id="contador">carregando…</span>
      <span>
        <button class="aba" id="abaAberto"    aria-pressed="true">Abertos</button>
        <button class="aba" id="abaResolvido" aria-pressed="false">Resolvidos</button>
      </span>
    </div>
    <div id="lista"></div>
  </section>

  <section class="painel" aria-label="Conversa">
    <div class="painel-topo">
      <button class="voltar" id="voltar">← Fila</button>
      <div>
        <div class="nome" id="pNome">—</div>
        <div class="fone" id="pFone"></div>
      </div>
      <div class="painel-acoes">
        <button class="btn" id="btnResolver" disabled>Marcar como resolvido</button>
      </div>
    </div>

    <div class="conversa" id="conversa">
      <p class="vazio">Escolha uma conversa na lista ao lado.</p>
    </div>

    <div class="resposta" id="caixaResposta" hidden>
      <div id="avisoJanela"></div>
      <textarea id="texto" placeholder="Escreva a resposta…" maxlength="4000"></textarea>
      <div class="resposta-baixo">
        <button class="btn btn-forte" id="btnEnviar">Enviar pelo WhatsApp</button>
        <span class="dica" id="dica"></span>
      </div>
      <p class="recado erro" id="erro" hidden></p>
    </div>
  </section>
</main>

<div class="portao" id="portao" hidden>
  <h2>Entre no sistema primeiro</h2>
  <p>Esta tela usa o mesmo login do sistema de qualidade. Abra o sistema, entre
     com seu e-mail e senha, e volte para cá.</p>
  <p><a href="sistema_qualidade_online.html">Abrir o sistema de qualidade →</a></p>
</div>

<script>
'use strict';
/* ---------------------------------------------------------------------------
   Como esta tela conversa com o resto:

   LER   -> direto do Supabase, com a sessão de quem está logado no SGQ. As
            tabelas wa_atendimento e wa_mensagem só abrem para authenticated.
   ESCREVER (mensagem) -> nunca direto na Meta. Vai para o servidor do SAC, que
            é quem tem o token do WhatsApp. Token dentro de navegador é token
            publicado.
--------------------------------------------------------------------------- */

const CFG_KEY   = 'sqmparis_supabase';          // mesma chave do SGQ
const SAC_KEY   = 'sqmparis_sac_servidor';      // permite trocar sem editar o arquivo
const SAC_PADRAO = 'https://sac-whatsapp-mfparis-production.up.railway.app';

function cfg(){
  try{ const c = JSON.parse(localStorage.getItem(CFG_KEY)); if(c && c.url && c.key) return c; }catch(e){}
  return { url:'https://ailzblgrxtdakpkchstl.supabase.co',
           key:'sb_publishable_WLhtMnPB4ZF0CFMvKthjCQ_xLjalDz4' };
}
function servidorSac(){
  try{ return localStorage.getItem(SAC_KEY) || SAC_PADRAO; }catch(e){ return SAC_PADRAO; }
}

const c  = cfg();
const sb = supabase.createClient(c.url, c.key);

const $ = id => document.getElementById(id);
let sessao = null, aberta = null, situacaoAba = 'ABERTO', relogio = null;

/* ------------------------------------------------------------- formatacao */
function fone(t){
  const n = String(t || '').replace(/\D/g,'');
  const m = n.match(/^55(\d{2})(\d{4,5})(\d{4})$/);
  return m ? `(${m[1]}) ${m[2]}-${m[3]}` : (t || '');
}
function hora(iso){
  return new Date(iso).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function dia(iso){
  const d = new Date(iso), hoje = new Date();
  const mesmo = (a,b) => a.toDateString() === b.toDateString();
  if(mesmo(d,hoje)) return 'Hoje';
  const ontem = new Date(hoje); ontem.setDate(hoje.getDate()-1);
  if(mesmo(d,ontem)) return 'Ontem';
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'long'});
}
function faz(iso){
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if(min < 1)    return 'agora';
  if(min < 60)   return `há ${min} min`;
  const h = Math.round(min/60);
  if(h < 24)     return `há ${h} h`;
  return `há ${Math.round(h/24)} dias`;
}

/* ----------------------------------------------------------------- sessao */
async function entrar(){
  const { data } = await sb.auth.getSession();
  sessao = data && data.session;
  if(!sessao){ $('portao').hidden = false; return false; }
  $('quem').textContent = (sessao.user && sessao.user.email) || '';
  $('tela').hidden = false;
  return true;
}

/* ------------------------------------------------------------------- fila */
async function carregarFila(){
  const { data, error } = await sb.from('wa_atendimento')
    .select('telefone, nome, motivo, situacao, resumo, aberto_em, atualizado_em')
    .eq('situacao', situacaoAba)
    .order('aberto_em', { ascending: situacaoAba === 'ABERTO' })
    .limit(200);

  const lista = $('lista');
  if(error){
    lista.innerHTML = '<p class="vazio">Não consegui ler a fila: ' + error.message + '</p>';
    return;
  }

  $('contador').textContent = data.length
    ? data.length + (situacaoAba === 'ABERTO' ? ' aguardando' : ' resolvidos')
    : (situacaoAba === 'ABERTO' ? 'Nada aguardando' : 'Nenhum resolvido');

  if(!data.length){
    lista.innerHTML = '<p class="vazio">' + (situacaoAba === 'ABERTO'
      ? 'Ninguém na fila. Tudo que chegou virou manifestação e foi para o SAC.'
      : 'Ainda não há conversas resolvidas.') + '</p>';
    return;
  }

  lista.innerHTML = '';
  for(const a of data){
    const b = document.createElement('button');
    b.className = 'item';
    b.type = 'button';
    if(aberta && aberta.telefone === a.telefone) b.setAttribute('aria-current','true');
    b.innerHTML =
      '<span class="quem">' + esc(a.nome || 'Sem nome') +
        '<span class="fone">' + fone(a.telefone) + '</span></span>' +
      '<span class="previa">' + esc(a.resumo || '—') + '</span>' +
      '<span class="quando">' + faz(a.atualizado_em) + '</span>';
    b.onclick = () => abrir(a);
    lista.appendChild(b);
  }
}
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* --------------------------------------------------------------- conversa */
async function abrir(a){
  aberta = a;
  document.body.classList.add('abriu');
  $('pNome').textContent = a.nome || 'Sem nome';
  $('pFone').textContent = fone(a.telefone) + ' · ' +
                           (a.motivo === 'PEDIU_HUMANO' ? 'pediu para falar com alguém'
                                                        : 'não é manifestação de SAC');
  $('btnResolver').disabled = (a.situacao !== 'ABERTO');
  $('btnResolver').textContent = a.situacao === 'ABERTO'
    ? 'Marcar como resolvido' : 'Resolvido';
  await carregarConversa();
  carregarFila();
}

async function carregarConversa(){
  const alvo = $('conversa');
  const { data, error } = await sb.from('wa_mensagem')
    .select('direcao, tipo, texto, criado_em, protocolo')
    .eq('telefone', aberta.telefone)
    .order('criado_em', { ascending:true })
    .limit(500);

  if(error){
    alvo.innerHTML = '<p class="vazio">Não consegui ler a conversa: ' + esc(error.message) + '</p>';
    return;
  }

  alvo.innerHTML = '';
  let ultimoDia = '';
  let ultimaDeles = null;

  for(const m of data){
    const d = dia(m.criado_em);
    if(d !== ultimoDia){
      const sep = document.createElement('div');
      sep.className = 'dia'; sep.textContent = d;
      alvo.appendChild(sep); ultimoDia = d;
    }
    const b = document.createElement('div');
    b.className = 'balao ' + (m.direcao === 'ENTRADA' ? 'deles' : 'nosso');
    const corpo = m.tipo === 'imagem' ? '<span class="anexo">[foto enviada pelo consumidor]</span>'
                : m.tipo === 'outro'  ? '<span class="anexo">[áudio, vídeo ou anexo não suportado]</span>'
                : esc(m.texto || '');
    b.innerHTML = corpo + '<span class="hora">' + hora(m.criado_em) +
                  (m.protocolo ? ' · ' + esc(m.protocolo) : '') + '</span>';
    alvo.appendChild(b);
    if(m.direcao === 'ENTRADA') ultimaDeles = m.criado_em;
  }
  alvo.scrollTop = alvo.scrollHeight;
  avaliarJanela(ultimaDeles);
}

/* ---------------------------------------------------------- janela de 24h */
/* O WhatsApp só deixa a empresa escrever livremente por 24 horas depois da
   última mensagem do consumidor. Passou disso, a API recusa. Melhor a tela
   avisar antes do que a pessoa escrever um texto longo e receber erro. */
function avaliarJanela(ultimaDeles){
  const caixa = $('caixaResposta');
  caixa.hidden = false;
  $('erro').hidden = true;

  if(!ultimaDeles){
    $('avisoJanela').innerHTML =
      '<div class="janela"><b>Sem mensagem do consumidor.</b> Não dá para iniciar '
      + 'conversa por aqui — o WhatsApp só permite responder a quem escreveu.</div>';
    $('texto').disabled = true; $('btnEnviar').disabled = true;
    return;
  }

  const horas = (Date.now() - new Date(ultimaDeles)) / 3600000;
  if(horas >= 24){
    $('avisoJanela').innerHTML =
      '<div class="janela"><b>Janela de 24 horas fechada.</b> A última mensagem '
      + 'desta pessoa foi ' + faz(ultimaDeles) + '. O WhatsApp não deixa mais '
      + 'responder por texto livre; é preciso ligar ou usar outro canal.</div>';
    $('texto').disabled = true; $('btnEnviar').disabled = true;
  } else {
    const restam = Math.floor(24 - horas);
    $('avisoJanela').innerHTML = '';
    $('texto').disabled = false; $('btnEnviar').disabled = false;
    $('dica').textContent = restam >= 1
      ? 'Restam cerca de ' + restam + ' h para responder.'
      : 'Menos de 1 h para responder.';
  }
}

/* ---------------------------------------------------------------- enviar */
async function enviar(){
  const texto = $('texto').value.trim();
  if(!texto || !aberta) return;

  $('btnEnviar').disabled = true;
  $('erro').hidden = true;

  try {
    const { data } = await sb.auth.getSession();
    const token = data && data.session && data.session.access_token;
    if(!token) throw new Error('sua sessão expirou — entre no sistema de novo');

    const r = await fetch(servidorSac() + '/atendimento/responder', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + token },
      body: JSON.stringify({ telefone: aberta.telefone, texto })
    });
    const corpo = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(corpo.erro || ('o servidor respondeu ' + r.status));

    $('texto').value = '';
    await carregarConversa();
  } catch(err){
    $('erro').textContent = 'Não enviei: ' + err.message;
    $('erro').hidden = false;
  } finally {
    $('btnEnviar').disabled = false;
  }
}

/* -------------------------------------------------------------- resolver */
async function resolver(){
  if(!aberta) return;
  $('btnResolver').disabled = true;
  const { error } = await sb.from('wa_atendimento').update({
    situacao:'RESOLVIDO',
    resolvido_em: new Date().toISOString(),
    resolvido_por: (sessao.user && sessao.user.email) || null
  }).eq('telefone', aberta.telefone);

  if(error){
    $('erro').textContent = 'Não consegui marcar como resolvido: ' + error.message;
    $('erro').hidden = false;
    $('btnResolver').disabled = false;
    return;
  }
  aberta.situacao = 'RESOLVIDO';
  $('btnResolver').textContent = 'Resolvido';
  carregarFila();
}

/* ------------------------------------------------------------------ ciclo */
function marcarHora(){
  $('atualizado').textContent = 'atualizado ' + new Date().toLocaleTimeString('pt-BR',
    { hour:'2-digit', minute:'2-digit' });
}

async function tique(){
  await carregarFila();
  if(aberta) await carregarConversa();
  marcarHora();
}

$('btnEnviar').onclick  = enviar;
$('btnResolver').onclick = resolver;
$('voltar').onclick = () => document.body.classList.remove('abriu');
$('abaAberto').onclick = () => trocarAba('ABERTO');
$('abaResolvido').onclick = () => trocarAba('RESOLVIDO');
function trocarAba(s){
  situacaoAba = s;
  $('abaAberto').setAttribute('aria-pressed', String(s === 'ABERTO'));
  $('abaResolvido').setAttribute('aria-pressed', String(s === 'RESOLVIDO'));
  carregarFila();
}
$('texto').addEventListener('keydown', e => {
  if((e.metaKey || e.ctrlKey) && e.key === 'Enter') enviar();
});

(async function(){
  if(!(await entrar())) return;
  await tique();
  relogio = setInterval(tique, 20000);
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') tique();
  });
})();
</script>
</body>
</html>
