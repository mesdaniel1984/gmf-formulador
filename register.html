<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GMF — Cadastro interno</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#1e3a8a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.22)}
h1{font-size:20px;color:#1e3a8a;font-weight:800;text-align:center;margin-bottom:8px}
p{font-size:13px;color:#6b7280;text-align:center;line-height:1.55}
.notice{margin:22px 0;background:#f8fafc;border:1px solid #dfe7ec;border-radius:10px;padding:14px;color:#425466;font-size:12px;line-height:1.5}
.link{text-align:center;margin-top:18px}
.link a{color:#1e3a8a;font-weight:700;text-decoration:none}
</style>
<link rel="stylesheet" href="gmf-auth.css">
<script defer src="gmf-auth.js"></script>
</head>
<body>
<div class="card">
  <h1>GMF Formulador</h1>
  <p>Cadastro de contas desativado neste endereço.</p>
  <div class="notice">
    Este é um ambiente interno. Novos acessos devem ser provisionados pela administração responsável pelo sistema.
  </div>
  <div class="link"><a href="login.html">← Voltar ao login</a></div>
</div>
</body>
</html>
