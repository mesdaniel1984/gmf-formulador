<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GMF — Criar Conta</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#1e3a8a;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:16px;padding:40px;width:100%;max-width:420px}
h1{font-size:20px;color:#1e3a8a;font-weight:800;text-align:center;margin-bottom:4px}
p{font-size:12px;color:#6b7280;text-align:center;margin-bottom:24px}
.field{margin-bottom:14px}
label{display:block;font-size:11px;font-weight:600;color:#374151;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
input{width:100%;height:42px;border:1.5px solid #e5e7eb;border-radius:8px;padding:0 12px;font-size:14px;outline:none}
input:focus{border-color:#1e3a8a}
.btn{width:100%;height:42px;background:#1e3a8a;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px}
.btn:disabled{background:#93c5fd}
.msg{margin-top:10px;padding:10px;border-radius:8px;font-size:13px;text-align:center}
.ok{background:#dcfce7;color:#166534}.err{background:#fef2f2;color:#dc2626}
.link{text-align:center;margin-top:14px;font-size:13px;color:#6b7280}
.link a{color:#1e3a8a;font-weight:600;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h1>GMF Formulador</h1>
  <p>Criar nova conta · Grupo MF Paris Alimentos</p>
  <div class="field"><label>Nome completo</label><input id="nome" type="text" placeholder="Seu nome completo"></div>
  <div class="field"><label>Email</label><input id="email" type="email" placeholder="seu@email.com"></div>
  <div class="field"><label>Senha (mín. 6 caracteres)</label><input id="senha" type="password" placeholder="••••••"></div>
  <div class="field"><label>Confirmar senha</label><input id="senha2" type="password" placeholder="••••••"></div>
  <button class="btn" id="btn" onclick="registrar()">Criar conta</button>
  <div id="msg"></div>
  <div class="link" style="margin-top:14px">Já tem conta? <a href="login.html">Fazer login</a></div>
</div>
<script>
const sb = window.supabase.createClient('https://ailzblgrxtdakpkchstl.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFpbHpibGdyeHRkYWtwa2Noc3RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NzkzOTEsImV4cCI6MjA5NDI1NTM5MX0.P22Cz4osfMvKBsbXn1jmwDC0ZOmbNQjSB-TBHxu6qRw');
function showMsg(txt,tipo){const el=document.getElementById('msg');el.className='msg '+tipo;el.textContent=txt;}
async function registrar(){
  const nome=document.getElementById('nome').value.trim();
  const email=document.getElementById('email').value.trim();
  const senha=document.getElementById('senha').value;
  const senha2=document.getElementById('senha2').value;
  const btn=document.getElementById('btn');
  if(!nome){showMsg('Informe seu nome.','err');return;}
  if(!email){showMsg('Informe seu email.','err');return;}
  if(senha.length<6){showMsg('Senha deve ter pelo menos 6 caracteres.','err');return;}
  if(senha!==senha2){showMsg('As senhas não coincidem.','err');return;}
  btn.disabled=true;btn.textContent='Criando conta...';
  const {data,error}=await sb.auth.signUp({email,password:senha,options:{data:{nome}}});
  if(error){showMsg('❌ '+error.message,'err');btn.disabled=false;btn.textContent='Criar conta';return;}
  showMsg('✅ Conta criada! Verifique seu email para confirmar.','ok');
  btn.textContent='Conta criada!';
  setTimeout(()=>window.location.href='login.html',3000);
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')registrar();});
</script>
</body>
</html>
